<svg xmlns="http://www.w3.org/2000/svg" width="860" height="680" viewBox="0 0 860 680" role="img" aria-labelledby="title desc">
  <title id="title">Contentrium CUT 기능 흐름도</title>
  <desc id="desc">실제 제품 화면이 아닌 사용 예시입니다. 카메라와 마이크 연결, 싱크와 화자 검토, 원본을 보존한 수정 가능한 개별 컷 생성의 순서입니다.</desc>
  <rect width="860" height="680" rx="20" fill="#f4f4ef"/>
  <g font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif">
    <text x="44" y="62" font-size="34" font-weight="700" fill="#222221">말하는 화자에서, 수정 가능한 컷으로</text>
    <g stroke="#d2d2cd" fill="#fff"><rect x="44" y="102" width="772" height="136" rx="14"/><rect x="44" y="270" width="772" height="136" rx="14"/><rect x="44" y="438" width="772" height="178" rx="14"/></g>
    <g font-size="29" font-weight="700" fill="#222221"><text x="72" y="150">01  트랙과 화자 연결</text><text x="72" y="318">02  싱크 · 분석 · 검토</text><text x="72" y="486">03  수정 가능한 개별 컷</text></g>
    <g font-size="24" fill="#50504b"><text x="72" y="199">카메라 A · B / 화자별 마이크 또는 혼합 녹음</text><text x="72" y="367">싱크를 확인하고, 화자와 카메라를 직접 검토</text><text x="72" y="585">새 결과 시퀀스 · 원본 / 오디오 / 별도 자막 유지</text></g>
    <g stroke="#91918a" stroke-width="2" fill="none"><path d="M430 243v22m-6-6 6 6 6-6"/><path d="M430 411v22m-6-6 6 6 6-6"/></g>
    <text x="72" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#222221">CUT</text>
    <rect x="146" y="510" width="232" height="42" rx="5" fill="#222221"/><rect x="384" y="510" width="166" height="42" rx="5" fill="#696961"/><rect x="556" y="510" width="232" height="42" rx="5" fill="#222221"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff"><text x="166" y="539">A</text><text x="404" y="539">B</text><text x="576" y="539">A</text></g>
    <text x="44" y="654" font-size="20" fill="#50504b">기능 흐름도 · 실제 제품 화면 아님</text>
  </g>
</svg>
